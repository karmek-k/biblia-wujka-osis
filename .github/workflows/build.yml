name: Build OSIS & SWORD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SWORD tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsword-utils diatheke libsword-common

      - name: Build OSIS file and SWORD module
        run: make sword

      - name: Upload OSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: osis
          path: out/bwujka.xml

      - name: Upload SWORD module artifact
        uses: actions/upload-artifact@v4
        with:
          name: sword-module
          path: out/bwujka_sword.zip
